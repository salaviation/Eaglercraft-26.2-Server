name: EaglerEnhancements
main: nuper.eagler.EaglerEnhancementsPlugin
version: 1.0.0
api-version: '1.21'
description: Eaglercraft HUD, authentication, login protection and sanctuaries
libraries:
  - org.bouncycastle:bcprov-jdk18on:1.78.1
commands:
  auth:
    description: Manage server authentication
  register:
    description: Register an authentication password
  login:
    description: Authenticate after joining
  changepassword:
    description: Change your authentication password
  spawnprotect:
    description: Toggle the default spawn sanctuary
  sanctuary:
    description: Create a sanctuary at your location
  removesanctuary:
    description: Remove every sanctuary containing your location
